<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Skyc Quick Save</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background: transparent !important;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .share-overlay-sheet {
      width: 100%;
      max-width: 500px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 1.5rem;
      box-shadow: var(--shadow-floating);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: sheetSlideUp 0.28s var(--ease-spring);
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: var(--radius-pill);
      background-color: var(--border-strong);
      margin: 0 auto -0.25rem;
    }
  </style>
</head>
<body>
  <div class="share-overlay-sheet">
    <div class="sheet-handle"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span class="brand-title" style="font-size: 1.35rem;">Skyc</span>
        <span class="badge badge-terracotta">Quick Save</span>
      </div>
      <button id="shareCloseBtn" class="btn-icon">✕</button>
    </div>

    <!-- Status / Info Box -->
    <div id="shareStatusBox" style="font-size: 0.92rem; color: var(--text-secondary);">
      Analyzing shared link...
    </div>

    <!-- Quick Preview -->
    <div id="sharePreviewBox" style="display: none; flex-direction: column; gap: 0.75rem;">
      <div style="display: flex; gap: 0.85rem; align-items: center;">
        <img id="shareThumb" style="width: 70px; height: 70px; border-radius: var(--radius-sm); object-fit: cover;" />
        <div style="display: flex; flex-direction: column; gap: 0.2rem; min-width: 0;">
          <span id="shareTitle" style="font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Title</span>
          <span id="shareAuthor" style="font-size: 0.8rem; color: var(--text-muted);">Author</span>
        </div>
      </div>
      <div id="shareFormatsContainer" class="format-options-grid" style="margin: 0.5rem 0;"></div>
      <button id="shareDownloadBtn" class="btn btn-primary" style="width: 100%;">Download Now</button>
    </div>
  </div>

  <script type="module" src="js/share.js"></script>
</body>
</html>
